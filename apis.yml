aid: protego-trust-bank
name: Protego Trust Bank
description: >-
  Protego Trust Bank is a Seattle, Washington digital-asset trust bank built for institutional
  clients, offering crypto-asset custody, trading, lending/borrowing and issuer services, with
  custody-related fiduciary services such as staking-as-a-service, protocol governance and voting,
  and fork and airdrop handling. Protego Trust Company received OCC conditional approval in
  February 2021 to convert into a national trust bank; that approval lapsed in February 2023 after
  pre-conversion requirements were not met. On 13 February 2026 the OCC granted parent Protego
  Holdings Corporation preliminary conditional approval (Corporate Decision #1366, control number
  2025-Charter-342009) to charter National Digital Trust Company, Seattle. Protego's marketing
  material has described API endpoints for trading and liquidity aggregation, but the company
  publishes no public developer portal, API reference or machine-readable contract, and as of
  this profile its own web properties do not complete a TLS handshake.
